  }).join('')}</div>${!admin ? '<div class="panel-actions"><button id="select-unchanged" class="secondary">Tout sélectionner / désélectionner (cette semaine)</button><button id="confirm-selected" class="primary" disabled>Confirmer les journées sélectionnées</button><small>Sélection limitée à la semaine affichée. Vérifiez les horaires avant de confirmer.</small></div>' : ''}</section><details class="panel month-detail"><summary>Consulter le récapitulatif mensuel</summary>${entryTable(u)}</details>`;
}
function balances(u) {
  const s = u.summary;
  return `<div class="stats">${stat('Report de récupération', signed(s.opening), 'À l’ouverture du 1er octobre')}${stat('Récupérations prises', h(s.elapsed.recovery), 'Depuis le début de l’exercice')}${stat('Formations réalisées', h(s.elapsed.training), 'Créditées dans la base horaire', 'purple')}${stat('Congés consommés', h(s.elapsed.leave), `Sur ${h(s.leaveOpening)} à l’ouverture`, 'sand')}</div><section class="panel"><div class="panel-heading"><div><h2>Soldes hebdomadaires</h2><p>Du lundi au dimanche · limites d’exercice proratisées · hors report</p></div></div><div class="table-wrap"><table><thead><tr><th>Semaine du</th><th>Base</th><th>Prévues</th><th>Travail</th><th>Dimanche</th><th>Majoration</th><th>Solde</th></tr></thead><tbody>${s.weeks.map(w => `<tr><th>${fmt(w.start)}</th><td>${h(w.base)}</td><td>${h(w.planned)}</td><td>${h(w.worked)}</td><td>${h(w.sunday)}</td><td>+${h(w.bonus)}</td><td class="number">${signed(w.balance)}</td></tr>`).join('')}</tbody></table></div></section><div class="dashboard-grid lower"><section class="panel"><div class="panel-heading"><div><h2>Bilan du mois complet</h2><p>${esc(monthName())} · ${s.month.missing} journée(s) manquante(s)</p></div></div>${balanceRows(s.month)}<p class="panel-footnote">Les absences et formations sont comptées séparément. Une récupération n’est pas créditée comme du travail.</p></section><section class="panel"><div class="panel-heading"><div><h2>Exercice ${state.year} — ${state.year + 1}</h2><p>Du 1er octobre au 30 septembre</p></div><span class="badge">${s.closed ? 'Clôturé' : 'En cours'}</span></div><div class="balance-list"><div><span>Solde de récupération à ce jour</span><strong>${signed(s.balance)}</strong></div><div><span>Congés restants à ce jour</span><strong>${h(s.leaveRemaining)}</strong></div><div><span>Dimanches travaillés à ce jour</span><strong>${h(s.elapsed.sunday)}</strong></div><div><span>Majoration des dimanches à ce jour</span><strong>${h(s.elapsed.bonus)}</strong></div>${s.closed ? `<div><span>Solde de clôture reporté</span><strong>${signed(s.closing)}</strong></div>` : ''}</div><p class="panel-footnote">À la clôture : report du solde de récupération et des congés restants, puis crédit fictif de 175 h de congés pour le nouvel exercice.</p>${state.me.role === 'admin' ? `<div class="panel-actions"><button id="close-year" class="secondary" ${s.closed || !s.opened ? 'disabled' : ''}>Clôturer et reporter les soldes →</button><small>Les 12 mois doivent être validés.</small></div>` : ''}</section></div>`;
}
function balanceRows(m) { return `<div class="balance-list"><div><span>Base de référence</span><strong>${h(m.base)}</strong></div><div><span>Heures prévues</span><strong>${h(m.planned)}</strong></div><div><span>Travail réalisé</span><strong>${h(m.worked)}</strong></div><div><span>Majoration dimanche</span><strong>+${h(m.bonus)}</strong></div><div><span>Congés payés / formation</span><strong>${h(m.leave)} / ${h(m.training)}</strong></div><div><span>Récupérations prises</span><strong>${h(m.recovery)}</strong></div><div class="total"><span>Mouvement du mois</span><strong>${signed(m.balance)}</strong></div></div>`; }
function validation() {
  return `<div class="inline-note"><span>▣</span><p>La validation simulée verrouille les saisies sur cet appareil uniquement. La signature fictive n’a aucune valeur légale. Une réouverture explicite reste possible avant la clôture annuelle.</p></div><div class="validation-grid">${state.users.map(u => `<section class="panel validation-card"><div class="panel-heading"><div class="person-heading"><span class="avatar">${u.name[0]}</span><div><h2>${esc(u.name)}</h2><p>${esc(u.site)}</p></div></div><span class="badge ${locked(u) ? 'locked' : ''}">${locked(u) ? 'Verrouillé' : 'À valider'}</span></div>${balanceRows(u.summary.month)}<div class="validation-status"><strong>${u.summary.month.missing ? u.summary.month.missing + ' journée(s) manquante(s)' : '✓ Toutes les journées requises sont confirmées'}</strong><p>${locked(u) ? `Validation : ${esc(u.validations.find(v => v.month === month)?.validated_at.slice(0, 10) ?? 'exercice clôturé')} · Signé : ${esc(u.validations.find(v => v.month === month)?.signer ?? '—')}` : 'Relisez les durées et les absences avant validation.'}</p></div><div class="panel-actions"><button data-validation="${u.id}" data-action="${locked(u) ? 'reopen' : 'validate'}" class="${locked(u) ? 'secondary' : 'primary'}" ${u.summary.closed || !u.summary.opened || (!locked(u) && u.summary.month.missing) ? 'disabled' : ''}>${locked(u) ? 'Réouvrir le mois' : 'Signer, valider et verrouiller le mois'}</button></div></section>`).join('')}</div>`;
}
function rules() {
  return `<section class="panel rules"><h2>La convention de cette démonstration</h2><p>Cette démonstration statique utilise uniquement des exemples inventés et une date fixe au 31 octobre 2026. Les règles ci-dessous constituent des hypothèses de fonctionnement à confirmer avant tout usage réel.</p><dl><dt>35 heures par semaine</dt><dd>La référence est répartie à raison de 7 h du lundi au vendredi, soit 35 h sur une semaine complète. Les horaires prévus sont modifiables uniquement par l’administration et sont affichés séparément ; elles ne changent pas la référence de calcul.</dd><dt>Les dimanches comptent double</dt><dd>5 h de travail le dimanche apparaissent comme 5 h réalisées et 5 h de majoration, soit 10 h créditées au compteur de récupération. La majoration est ajoutée une seule fois. Aucun autre taux de majoration n’est appliqué dans cette démonstration.</dd><dt>Le mouvement du compteur de récupération</dt><dd>Travail réalisé + majoration du dimanche + congés payés + formation − base de référence. Une journée de récupération n’est pas créditée comme du travail : elle consomme ainsi 7 h sur un jour de semaine, sans seconde déduction.</dd><dt>Congés, récupérations et formations</dt><dd>Une seule activité par jour dans cette première version. Congés, récupérations et formations couvrent 7 h par journée complète. Un repos vaut 0 h travaillée ; en semaine, il réduit donc le solde de récupération de la base de 7 h. Les demi-journées mixtes, jours fériés et règles légales d’acquisition ne sont pas encore gérés. Les congés sont suivis en heures ; 7 h correspondent à une journée de référence.</dd><dt>Une période du 1er octobre au 30 septembre</dt><dd>La clôture est réservée à l’administrateur après validation des 12 mois. Elle fige les résultats, reporte automatiquement la récupération et les congés restants, puis crédite 175 h fictives de congés pour le nouvel exercice. Les soldes d’ouverture de démonstration sont de 12 h pour le profil A, 7 h pour le profil B et 175 h de congés chacun.</dd><dt>Soldes provisoires et journées manquantes</dt><dd>Les horaires réels sont calculés à partir des arrivées et départs du matin et de l’après-midi. Les journées prévues non confirmées ne créditent aucune heure réelle. Le solde annuel à ce jour utilise la base des jours ouvrés écoulés, même si la saisie manque. Le bilan mensuel utilise le mois entier et le bilan hebdomadaire les semaines entières, limitées aux dates de l’exercice. Des soldes négatifs peuvent donc signaler des saisies futures ou manquantes. La validation exige toutes les journées prévues confirmées, y compris les dimanches travaillés. Les journées futures ne peuvent pas être confirmées.</dd><dt>Un accès personnel et un accès administrateur</dt><dd>Chaque rôle salarié affiche uniquement son profil fictif. L’administration consulte et modifie les deux profils. Les restrictions de rôle et le verrouillage sont simulés dans le navigateur. Il ne s’agit pas d’une protection d’accès : tout visiteur peut choisir tous les rôles. La validation peut être annulée par l’administrateur avant clôture annuelle.</dd></dl></section>`;
}
function bind() {
  bindReset();
  document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { page = b.dataset.page; render(); document.querySelector('#main-content').focus(); });
  document.querySelectorAll('[data-user]').forEach(b => b.onclick = () => { selected = b.dataset.user; render(); });
  document.querySelectorAll('[data-month]').forEach(b => b.onclick = async () => { const d = new Date(month + '-01T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + Number(b.dataset.month)); const next = d.toISOString().slice(0, 7); if (next < '2026-10' || next > '2101-09') return; month = next; await reload(); });
  const monthInput = document.querySelector('#month'); if (monthInput) monthInput.onchange = async e => { if (!e.target.value) return; month = e.target.value; await reload(); };
  document.querySelectorAll('.logout').forEach(b => b.onclick = async () => { try { await api('logout', {}); login(); } catch (e) { notice(e.message, true); } });
  document.querySelectorAll('.add-entry').forEach(b => b.onclick = () => edit(month === today().slice(0, 7) ? today() : month + '-01'));
  document.querySelectorAll('[data-week]').forEach(b => b.onclick = () => { weekIndex = Number(b.dataset.week); render(); });
  document.querySelectorAll('[data-select-day]').forEach(c => c.onchange = () => { document.querySelector('#confirm-selected').disabled = !document.querySelector('[data-select-day]:checked'); });
  document.querySelectorAll('[data-confirm-day]').forEach(b => b.onclick = () => confirmDays([b.dataset.confirmDay]));
  const selectAll = document.querySelector('#select-unchanged');
  if (selectAll) selectAll.onclick = () => {
    const boxes = [...document.querySelectorAll('[data-select-day]')];
    const allChecked = boxes.length > 0 && boxes.every(c => c.checked);
    boxes.forEach(c => c.checked = !allChecked);
    document.querySelector('#confirm-selected').disabled = !document.querySelector('[data-select-day]:checked');
  };
  const bulk = document.querySelector('#confirm-selected');
  if (bulk) bulk.onclick = () => confirmDays([...document.querySelectorAll('[data-select-day]:checked')].map(c => c.dataset.selectDay));
  document.querySelectorAll('[data-date]').forEach(b => b.onclick = () => edit(b.dataset.date));
  document.querySelectorAll('[data-validation]').forEach(b => b.onclick = async () => {
    const action = b.dataset.action;
    if (!confirm(action === 'validate' ? 'Simuler la signature Administration fictive, valider ce mois et verrouiller ses saisies sur cet appareil ?' : 'Réouvrir ce mois et autoriser à nouveau les modifications ?')) return;
    const signature = action === 'validate' ? 'Administration fictive' : undefined;
    if (action === 'validate' && !signature) return;
    b.disabled = true;
    try { await api(action, { userId: b.dataset.validation, month, signature }); await load(); notice(action === 'validate' ? 'Mois validé et verrouillé.' : 'Mois réouvert.'); } catch (e) { notice(e.message, true); b.disabled = false; }
  });
  const close = document.querySelector('#close-year');
  if (close) close.onclick = async () => { if (!confirm('Clôturer définitivement cet exercice et reporter les soldes vers le suivant ?')) return; try { await api('close-year', { userId: user().id, year: state.year }); await load(); notice('Exercice clôturé. Les soldes ont été reportés.'); } catch (e) { notice(e.message, true); } };
}
async function reload() { try { await load(); } catch (e) { notice(e.message, true); } }
async function confirmDays(ds) {
  const u = user();
  document.querySelectorAll('[data-confirm-day],#confirm-selected').forEach(b => b.disabled = true);
  try {
    await api('confirm', { userId: u.id, days: ds.map(date => ({ date, revision: u.entries.find(e => e.date === date).revision })) });
    await load(); notice(`${ds.length} journée(s) confirmée(s). Les compteurs sont à jour.`);
  } catch (e) { notice(e.message, true); await reload(); }
}
function edit(date) {
  const u = user(), e = u.entries.find(e => e.date === date), admin = state.me.role === 'admin';
  const slots = (admin ? e?.plannedSlots : e?.actualSlots ?? e?.plannedSlots) ?? emptySlots();
  const kind = (admin || !e?.confirmed ? e?.plannedKind : e?.kind) ?? 'travail';
  editor.innerHTML = `<form id="entry-form"><div class="dialog-heading"><div><p class="eyebrow">${esc(u.name)} · ${admin ? 'PRÉVISION ADMINISTRATEUR' : 'SAISIE PAR EXCEPTION'}</p><h2 id="editor-title">${admin ? 'Préparer les horaires' : 'Modifier mes horaires'}</h2></div><button type="button" class="icon-button" id="cancel" aria-label="Fermer">×</button></div><label>Date<input name="date" type="date" required value="${date}" min="${state.year}-10-01" max="${state.year + 1}-09-30"></label><p class="planned-line">Prévision · ${esc(kinds[e?.plannedKind] ?? 'À préparer')}<br><strong>${esc(slotText(e?.plannedSlots))}</strong></p><label>Activité<select name="kind">${Object.entries(kinds).map(([id, label]) => `<option value="${id}" ${kind === id ? 'selected' : ''}>${label}</option>`).join('')}</select></label><div id="slot-fields" class="form-columns">${slotKeys.map((key, i) => `<label>${slotLabels[i]}<input name="${key}" type="time" step="60" value="${esc(slots[key])}"></label>`).join('')}</div><p id="computed-duration" class="computed-duration" aria-live="polite"></p><p class="field-help">${admin ? 'Les prévisions restent distinctes des heures réelles déjà confirmées.' : 'Corrigez uniquement les champs concernés. Les prévisions restent inchangées.'} Pour une période non travaillée, effacez son arrivée et son départ.</p>${admin ? '' : `<label>Note fictive (facultatif)<textarea name="note" rows="2" maxlength="500">${esc(e?.note)}</textarea></label>`}<p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-bottom">Annuler</button><button class="primary" type="submit">${admin ? 'Enregistrer les prévisions' : 'Enregistrer ma journée'}</button></div></form>`;
  const form = editor.querySelector('form');
  editor.querySelectorAll('#cancel,#cancel-bottom').forEach(b => b.onclick = () => editor.close());
  form.elements.date.onchange = () => { const next = form.elements.date.value; if (next) { editor.close(); edit(next); } };
  const compute = () => {
    const work = form.elements.kind.value === 'travail';
    editor.querySelector('#slot-fields').hidden = !work;
    const values = slotKeys.map(k => form.elements[k].value);
    let minutes = 0, valid = true;
    for (const i of [0, 2]) {
      if (!values[i] && !values[i + 1]) continue;
      if (!values[i] || !values[i + 1] || values[i + 1] <= values[i]) { valid = false; break; }
      const n = v => Number(v.slice(0, 2)) * 60 + Number(v.slice(3));
      minutes += n(values[i + 1]) - n(values[i]);
    }
    if (values[1] && values[2] && values[2] < values[1]) valid = false;
    editor.querySelector('#computed-duration').textContent = work ? valid ? `Total ${admin ? 'prévu' : 'réel'} calculé : ${h(minutes)}${new Date(date).getUTCDay() === 0 && !admin ? ` + ${h(minutes)} de majoration dimanche` : ''}` : 'Complétez des périodes valides, sans chevauchement.' : form.elements.kind.value === 'repos' ? 'Repos · 0 h travaillée' : 'Journée complète · 7 h d’activité · 0 h travaillée';
  };
  form.oninput = compute; compute();
  form.onsubmit = async event => {
    event.preventDefault(); const button = form.querySelector('[type="submit"]'); button.disabled = true;
    const data = Object.fromEntries(new FormData(form));
    try {
      await api(admin ? 'plan' : 'entry', { userId: u.id, date: data.date, kind: data.kind, slots: Object.fromEntries(slotKeys.map(k => [k, data[k]])), note: data.note, revision: e?.revision });
      editor.close(); await load(); notice(admin ? 'Prévisions enregistrées.' : 'Journée enregistrée. Les compteurs sont à jour.');
    } catch (error) { editor.querySelector('#form-error').textContent = error.message; } finally { button.disabled = false; }
  };
  editor.showModal();
}
try { await load(); } catch { login(); }
</script>
